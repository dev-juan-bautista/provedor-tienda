server:
  port: 8080
spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  application:
    name: ProvedorTienda
  devtools:
    add-properties: false
    restart:
     enabled: false
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
aws:
  region: ${AWS_REGION:us-east-2}
  dynamodb:
    endpoint: "http://localhost:8000"
